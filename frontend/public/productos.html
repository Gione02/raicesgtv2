<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      name="description"
      content="Catálogo de trajes típicos, huipiles, blusas y cortes guatemaltecos. Busca por departamento, categoría o color."
    />
    <title>Colección de textiles | RaícesGT</title>
    <!-- open-graph: generado por scripts/open-graph.js -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RaícesGT" />
    <meta property="og:locale" content="es_GT" />
    <meta property="og:title" content="Colección de textiles | RaícesGT" />
    <meta property="og:description" content="Catálogo de trajes típicos, huipiles, blusas y cortes guatemaltecos. Busca por departamento, categoría o color." />
    <meta property="og:image" content="https://epfyswdzqwkryvyuqycd.supabase.co/storage/v1/object/public/catalogo/compartir.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RaícesGT: textiles típicos de Guatemala" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e1b4b" />
    <!-- /open-graph -->
    <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bg-background text-on-background antialiased min-h-screen flex flex-col" data-pagina="productos">
    <header id="encabezado" class="sticky top-0 z-50 h-[72px] bg-deep-indigo"></header>

    <main class="flex-grow">
      <!-- Hero + búsqueda -->
      <section
        class="w-full bg-gradient-to-br from-surface-container-low to-surface-container py-16 md:py-20 px-margin-mobile md:px-margin-desktop relative overflow-hidden"
      >
        <div
          class="absolute inset-0 opacity-10 pointer-events-none"
          style="background-image: radial-gradient(circle at 2px 2px, #00647c 1px, transparent 0); background-size: 32px 32px"
        ></div>
        <div class="max-w-3xl mx-auto text-center relative z-10">
          <span class="inline-flex px-3.5 py-1.5 rounded-full bg-mesh-blue text-primary font-black text-[0.82rem] mb-4">
            NUESTRA COLECCIÓN
          </span>
          <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-on-surface mb-5">
            Explora nuestra herencia
          </h1>
          <p class="text-lg text-on-surface-variant mb-10 max-w-2xl mx-auto">
            Descubre la rica historia tejida en cada hilo. Encuentra textiles por región y déjate cautivar por la
            maestría artesanal guatemalteca.
          </p>

          <div class="relative max-w-2xl mx-auto group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-primary">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </div>
            <input
              id="busqueda"
              aria-label="Buscar textiles"
              class="w-full pl-12 pr-4 py-4 bg-white rounded-full border border-border-cool focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-300 shadow-sm group-hover:shadow-md outline-none text-on-surface placeholder-outline"
              placeholder="Ej. Sololá, huipil, rojo..."
              type="search"
            />
          </div>
        </div>
      </section>

      <!-- Resultados -->
      <section class="max-w-container-max mx-auto w-full px-margin-mobile md:px-margin-desktop py-12 md:py-16">
        <!-- Filtros -->
        <div class="bg-white rounded-xl border border-border-cool shadow-sm p-4 md:p-5 mb-8">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wide text-on-surface-variant mb-1.5">Departamento</span>
              <select id="filtro-departamento" class="w-full rounded-lg border-border-cool focus:border-primary focus:ring-primary/20 text-sm"></select>
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wide text-on-surface-variant mb-1.5">Categoría</span>
              <select id="filtro-categoria" class="w-full rounded-lg border-border-cool focus:border-primary focus:ring-primary/20 text-sm"></select>
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wide text-on-surface-variant mb-1.5">Color</span>
              <select id="filtro-color" class="w-full rounded-lg border-border-cool focus:border-primary focus:ring-primary/20 text-sm"></select>
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wide text-on-surface-variant mb-1.5">Ordenar por</span>
              <select id="filtro-orden" class="w-full rounded-lg border-border-cool focus:border-primary focus:ring-primary/20 text-sm">
                <option value="relevancia">Destacados</option>
                <option value="recientes">Más recientes</option>
                <option value="nombre-asc">Nombre (A–Z)</option>
                <option value="nombre-desc">Nombre (Z–A)</option>
              </select>
            </label>
          </div>
          <div id="filtros-activos" class="hidden flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-border-cool"></div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="text-2xl md:text-3xl font-bold text-on-surface">Resultados</h2>
            <p id="contador" class="text-sm text-on-surface-variant mt-1" aria-live="polite"></p>
          </div>
          <div class="inline-flex p-1 rounded-full bg-surface-container-low border border-border-cool" role="group" aria-label="Tipo de vista">
            <button type="button" id="btn-vista-grid" onclick="cambiarVista('grid')" aria-label="Ver en columnas" title="Columnas"
              class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <span class="hidden sm:inline">Columnas</span>
            </button>
            <button type="button" id="btn-vista-lista" onclick="cambiarVista('lista')" aria-label="Ver en lista" title="Lista"
              class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="5" rx="1"/><rect x="3" y="15" width="5" height="5" rx="1"/><path d="M12 6.5h9M12 17.5h9"/></svg>
              <span class="hidden sm:inline">Lista</span>
            </button>
          </div>
        </div>

        <div id="resultados"></div>
      </section>
    </main>

    <footer id="pie"></footer>

    <!-- Modal de detalle -->
    <div
      class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300"
      id="product-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div
        class="bg-white rounded-xl border border-border-cool shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto flex flex-col md:flex-row transform scale-95 transition-transform duration-300"
      >
        <div class="md:w-1/2 h-72 md:h-auto relative bg-surface-container-low">
          <img alt="" class="w-full h-full object-cover" id="modal-img" src="" />
          <div
            class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-primary text-sm font-semibold px-3 py-1 rounded-full border border-primary/10"
            id="modal-status"
          ></div>
        </div>
        <div class="md:w-1/2 p-6 md:p-10 flex flex-col relative">
          <button
            type="button"
            aria-label="Cerrar"
            class="absolute top-4 right-4 text-on-surface-variant hover:text-primary transition-colors bg-surface-container-low rounded-full p-1"
            onclick="closeModal()"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <span id="modal-categoria" class="self-start text-xs font-semibold uppercase tracking-wide text-tertiary bg-tertiary-fixed/40 px-2.5 py-1 rounded-full mb-3"></span>
          <h3 class="text-2xl md:text-3xl font-bold text-on-surface mb-4 pr-8" id="modal-title"></h3>
          <p class="text-on-surface-variant mb-6" id="modal-desc"></p>
          <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 text-sm mb-8">
            <dt class="font-semibold text-on-surface">Origen</dt>
            <dd class="text-on-surface-variant" id="modal-municipio"></dd>
            <dt class="font-semibold text-on-surface">Color</dt>
            <dd class="text-on-surface-variant" id="modal-color"></dd>
            <dt class="font-semibold text-on-surface">Precio</dt>
            <dd class="text-on-surface-variant">Consulta precio y disponibilidad</dd>
          </dl>
          <div class="mt-auto pt-6 border-t border-border-cool space-y-3">
            <button
              type="button"
              id="modal-whatsapp"
              class="w-full bg-whatsapp hover:brightness-105 text-white font-bold px-6 py-3 rounded-full transition-all duration-300 shadow-md hover:-translate-y-0.5 flex items-center justify-center gap-2"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>
              Consultar por WhatsApp
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/producto.js"></script>
    <script src="./js/datos.js"></script>
    <script src="./js/catalogo.js"></script>
  </body>
</html>
